spring.application.name=pawhome-backend
server.port=5000

# H2 file database - lives at ./database/pawhome.mv.db, no server to install,
# same convenience as the SQLite version. Point this at MySQL instead by
# swapping these 3 lines + the mysql-connector dependency if you want to.
spring.datasource.url=jdbc:h2:file:./database/pawhome;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run database/schema.sql on every startup (all statements are IF NOT EXISTS,
# so this is safe to run repeatedly and never duplicates tables)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Let JSON keys be snake_case (full_name, adoption_fee, image_url, ...)
# while Java fields stay normal camelCase (fullName, adoptionFee, imageUrl, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Serve the frontend folder (copied into src/main/resources/static) at "/"
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
