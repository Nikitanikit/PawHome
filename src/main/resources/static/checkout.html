<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — PawHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .pay-methods{display:flex; gap:10px; margin-bottom:20px;}
  .pay-method{flex:1; border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px; text-align:center; cursor:pointer; font-weight:600; font-size:14px;}
  .pay-method.active{border-color:var(--sage); background:var(--success-bg); color:var(--sage-deep);}
  .receipt-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; margin-bottom:14px;}
</style>
</head>
<body>
<div id="site-navbar"></div>

<div class="container" style="padding:44px 0 100px; max-width:640px;">
  <h1 style="font-size:30px;">Checkout</h1>
  <p id="checkoutIntro">Review your order and complete the adoption fee payment below.</p>

  <div id="checkoutBody">
    <div class="loading"><span class="spinner"></span> Loading order...</div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
