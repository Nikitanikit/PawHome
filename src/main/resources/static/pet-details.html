<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Details — PawHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .details-wrap{padding:40px 0 20px; display:grid; grid-template-columns:1fr 1fr; gap:48px;}
  @media (max-width:880px){.details-wrap{grid-template-columns:1fr;}}
  .details-img{border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); aspect-ratio:1/1;}
  .details-img img{width:100%; height:100%; object-fit:cover;}
  .spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0; padding:20px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);}
  .spec-grid div span{display:block; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}
  .spec-grid div strong{font-size:15px;}
  .details-actions{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}
  .back-link{display:inline-block; margin:24px 0 0; font-weight:600;}
</style>
</head>
<body>
<div id="site-navbar"></div>

<div class="container">
  <a href="browse.html" class="back-link">← Back to all pets</a>
</div>

<div class="container" id="detailsContainer">
  <div class="loading"><span class="spinner"></span> Loading pet details...</div>
</div>

<div style="height:60px;"></div>
<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pet-details.js"></script>
</body>
</html>
