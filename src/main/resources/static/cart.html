<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — PawHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .cart-wrap{display:grid; grid-template-columns:2fr 1fr; gap:32px; align-items:start; padding:44px 0 80px;}
  @media (max-width:860px){.cart-wrap{grid-template-columns:1fr;}}
  .cart-item{display:flex; gap:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .cart-item img{width:88px; height:88px; border-radius:var(--radius-sm); object-fit:cover;}
  .cart-item .info{flex:1;}
  .cart-item .info h3{font-size:17px; margin-bottom:2px;}
  .summary-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:24px; position:sticky; top:96px;}
  .summary-row{display:flex; justify-content:space-between; margin-bottom:10px; font-size:14.5px; color:var(--ink-soft);}
  .summary-total{display:flex; justify-content:space-between; font-weight:700; font-size:18px; color:var(--ink); border-top:1px solid var(--line); padding-top:14px; margin-top:6px;}
</style>
</head>
<body>
<div id="site-navbar"></div>

<div class="container">
  <h1 style="padding-top:36px; font-size:32px;">Your cart</h1>
  <p>Complete payment for the adoption fee, then finish a short application for each pet.</p>
</div>

<div class="container cart-wrap">
  <div id="cartItems">
    <div class="loading"><span class="spinner"></span> Loading your cart...</div>
  </div>
  <div class="summary-card">
    <h3 style="font-size:18px;">Order summary</h3>
    <div id="summaryRows"></div>
    <div class="summary-total"><span>Total</span><span id="summaryTotal">₹0</span></div>
    <button class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top:20px;" disabled>Proceed to Payment</button>
    <p class="hint" style="margin-top:10px;">Adoption fees help cover shelter care, vaccination and medical checkups.</p>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
