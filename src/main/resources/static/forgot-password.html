<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — PawHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-navbar"></div>

<div class="container" style="padding:64px 0 100px;">
  <div class="form-card">
    <h1 style="font-size:26px; text-align:center;">Reset your password</h1>
    <p style="text-align:center; margin-bottom:26px;">Confirm your email and choose a new password. (This demo skips sending an email — a real deployment would email a secure reset link.)</p>

    <div class="alert alert-error" id="formError"></div>
    <div class="alert alert-success" id="formSuccess"></div>

    <form id="resetForm" novalidate>
      <div class="field" id="f-email">
        <label for="email">Account email</label>
        <input type="email" id="email">
      </div>
      <div class="field" id="f-new_password">
        <label for="new_password">New password</label>
        <input type="password" id="new_password">
        <div class="hint">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
    </form>
    <p style="text-align:center; margin-top:18px;"><a href="login.html">← Back to log in</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
renderNavbar();
const form = document.getElementById("resetForm");
const errorAlert = document.getElementById("formError");
const successAlert = document.getElementById("formSuccess");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorAlert.classList.remove("show");
  successAlert.classList.remove("show");
  const email = document.getElementById("email").value.trim();
  const new_password = document.getElementById("new_password").value;
  if (!email || new_password.length < 6){
    errorAlert.textContent = "Enter your email and a password of at least 6 characters.";
    errorAlert.classList.add("show");
    return;
  }
  setLoading(submitBtn, true, "Updating...");
  try{
    await api.post("/auth/forgot-password", { email, new_password });
    successAlert.textContent = "Password updated. Redirecting to log in…";
    successAlert.classList.add("show");
    setTimeout(() => window.location.href = "login.html", 1400);
  }catch(err){
    errorAlert.textContent = err.message;
    errorAlert.classList.add("show");
  }finally{
    setLoading(submitBtn, false);
  }
});
</script>
</body>
</html>
